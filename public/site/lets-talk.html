<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get in Touch — Dariia Letucha</title>
    <link rel="stylesheet" href="page.css" />
    <link rel="stylesheet" href="talk.css" />
    <link rel="stylesheet" href="site-effects.css" />
    <link rel="stylesheet" href="cursor.css" />
    <script src="page.js" defer></script>
    <script src="talk.js" defer></script>
    <script src="site-effects.js" defer></script>
    <script src="cursor.js" defer></script>
  </head>
  <body class="talk-dark-page">
    <main class="talk-page">
      <section class="talk-form-section" aria-label="Contact form">
        <h1 class="talk-form-bg" aria-hidden="true"><span>Get in</span><span>Touch</span></h1>
        <div class="talk-contact-pills" aria-label="Contact links">
          <a class="talk-email" href="mailto:dariialetucha@gmail.com">dariialetucha@gmail.com</a>
          <a href="https://www.instagram.com/" target="_blank" rel="noreferrer">Instagram</a>
          <a href="https://www.linkedin.com/" target="_blank" rel="noreferrer">LinkedIn</a>
        </div>
        <form class="talk-form" action="mailto:darialetucha@gmail.com" method="post" enctype="text/plain">
          <p class="form-kicker">Fill the form to request a quote:</p>
          <div class="field-row">
            <input type="text" name="name" placeholder="Your Name *" autocomplete="name" />
            <input type="email" name="email" placeholder="Email *" autocomplete="email" />
          </div>
          <input type="text" name="messenger" placeholder="Telegram / WhatsApp (Optional)" autocomplete="tel" />
          <textarea name="project" placeholder="Tell us about your project *"></textarea>

          <p class="service-title">Services are interested in</p>
          <div class="service-grid">
            <label class="service-option"><input type="checkbox" name="services" value="Web design" /><span class="service-dot"></span><span>Web design</span></label>
            <label class="service-option"><input type="checkbox" name="services" value="Frontend" /><span class="service-dot"></span><span>Frontend</span></label>
            <label class="service-option"><input type="checkbox" name="services" value="Wix" /><span class="service-dot"></span><span>Wix</span></label>
            <label class="service-option"><input type="checkbox" name="services" value="Readymag" /><span class="service-dot"></span><span>Readymag</span></label>
            <label class="service-option"><input type="checkbox" name="services" value="Webflow" /><span class="service-dot"></span><span>Webflow</span></label>
            <label class="service-option"><input type="checkbox" name="services" value="WordPress" /><span class="service-dot"></span><span>WordPress</span></label>
            <label class="service-option"><input type="checkbox" name="services" value="Branding" /><span class="service-dot"></span><span>Branding</span></label>
            <label class="service-option"><input type="checkbox" name="services" value="Long term collaboration" /><span class="service-dot"></span><span>Long term collaboration</span></label>
            <label class="service-option"><input type="checkbox" name="services" value="Framer" /><span class="service-dot"></span><span>Framer</span></label>
            <label class="service-option"><input type="checkbox" name="services" value="Shopify" /><span class="service-dot"></span><span>Shopify</span></label>
            <label class="service-option service-option-wide"><input type="checkbox" name="services" value="Setup Website, Hosting and Domain" /><span class="service-dot"></span><span>Setup Website, Hosting and Domain</span></label>
            <label class="service-option"><input type="checkbox" name="services" value="Brand identity" /><span class="service-dot"></span><span>Brand identity</span></label>
          </div>

          <div class="submit-row">
            <button class="submit-button inline-link" type="submit">Send Message</button>
          </div>
        </form>
      </section>
    </main>

    <nav class="portfolio-dock" aria-label="Portfolio pages">
      <a href="/home">Home</a>
      <a href="projects.html">Projects</a>
      <a href="about.html">About</a>
      <a href="lets-talk.html" aria-current="page">Contact</a>
    </nav>
  </body>
</html>
